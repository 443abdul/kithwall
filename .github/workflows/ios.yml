name: iOS

# Proves the Kithwall iOS app (apps/mobile/ios, docs/v2/05-native.md §8) compiles: a simulator build and
# an unsigned device archive, including the Notification Service Extension (added to the Xcode project
# by apps/mobile/ios/scripts/add-notification-service.rb until someone commits it from a Mac).
# macOS minutes are expensive: manual runs and version tags only.
#
# Signing (prepared, skipped until the Apple Developer account exists): set the repository secrets
#   APPLE_TEAM_ID, APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
#   APPLE_PROVISIONING_PROFILE_BASE64, APPLE_NSE_PROVISIONING_PROFILE_BASE64
# and the job also produces a signed .ipa for TestFlight (upload it with Transporter or altool).

on:
  workflow_dispatch:
    inputs:
      env:
        description: Which server the app loads
        type: choice
        options: [production, staging]
        default: production
  push:
    tags: ['v*']
    branches: [v2]
    paths:
      - 'apps/mobile/ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator build + unsigned archive
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KITHWALL_ENV: ${{ inputs.env || 'production' }}
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      # Never bake the Vercel protection-bypass secret into CI builds (security review N2).
      - name: Bundle the offline page and sync Capacitor
        working-directory: apps/mobile
        run: node scripts/prepare.mjs && npx cap sync ios

      - name: Add the Notification Service Extension target
        run: |
          gem install xcodeproj --no-document --user-install
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          ruby apps/mobile/ios/scripts/add-notification-service.rb

      - name: Simulator build
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0

      - name: Unsigned device archive (Release)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kithwall.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0

      # ---------------------------------------------------------------------------------------
      # Signed build for TestFlight: only when the Apple secrets exist.
      - name: Import signing certificate and profiles
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          NSE_PROFILE: ${{ secrets.APPLE_NSE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/kithwall-app.mobileprovision
          if [ -n "$NSE_PROFILE" ]; then
            echo "$NSE_PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/kithwall-nse.mobileprovision
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Signed archive and .ipa
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/mobile/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kithwall-signed.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic archive
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kithwall-signed.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: kithwall-ios-${{ env.KITHWALL_ENV }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Clean up the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
