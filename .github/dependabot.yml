version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      noble: { patterns: ["@noble/*", "@scure/*"] }
      supabase: { patterns: ["@supabase/*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
