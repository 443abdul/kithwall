# Kithwall mirror with nginx (docs/v2/08-censorship.md §1): equivalent to the Caddyfile next to this file.
# Certificate: certbot --nginx -d mirror.example.org. Install as /etc/nginx/conf.d/kithwall.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mirror.example.org;
    ssl_certificate     /etc/letsencrypt/live/mirror.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirror.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;                     # people's traffic: no logs
    client_max_body_size 110m;          # encrypted media uploads
    resolver 1.1.1.1 9.9.9.9 valid=300s;

    # Supabase (REST, Auth, Storage, Realtime incl. WebSocket) under /sb
    location /sb/ {
        set $sb https://uvuojqziktbwxkjzeiar.supabase.co;
        rewrite ^/sb/(.*)$ /$1 break;
        proxy_pass $sb;
        proxy_ssl_server_name on;
        proxy_set_header Host uvuojqziktbwxkjzeiar.supabase.co;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;          # Realtime sockets stay open
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # The Next.js app on Vercel
    location / {
        set $app https://www.kithwall.com;
        proxy_pass $app;
        proxy_ssl_server_name on;
        proxy_set_header Host www.kithwall.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mirror.example.org;
    return 301 https://$host$request_uri;
}
